<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Shopping DB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/customers">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/products">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/orders">Orders</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Product Details</h2>
        
        <div class="card">
            <div class="card-body">
                <p><strong>ID:</strong> <span th:text="${product.id}"></span></p>
                <p><strong>Name:</strong> <span th:text="${product.name}"></span></p>
                <p><strong>Price:</strong> <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span></p>
                <p><strong>In Stock:</strong> 
                    <span th:if="${product.inStock}" class="badge bg-success">Yes</span>
                    <span th:unless="${product.inStock}" class="badge bg-danger">No</span>
                </p>
                <p><strong>Category:</strong> <span th:text="${product.category != null ? product.category.name : 'N/A'}"></span></p>
            </div>
        </div>
        
        <h3 class="mt-4">Comments</h3>
        <div class="list-group mb-3">
            <div th:each="comment : ${comments}" class="list-group-item">
                <p th:text="${comment.text}"></p>
            </div>
            <div th:if="${#lists.isEmpty(comments)}" class="list-group-item">
                <p class="text-muted">No comments yet</p>
            </div>
        </div>
        
        <h4>Add Comment</h4>
        <form th:action="@{/products/{id}/comments(id=${product.id})}" method="post">
            <div class="mb-3">
                <textarea class="form-control" name="text" rows="3" placeholder="Enter your comment"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Comment</button>
        </form>
        
        <a href="/products" class="btn btn-secondary mt-3">Back to List</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
