spring:
    application:
        name: 22003405-nguyenvanminh-week07
    thymeleaf:
        cache: false
        prefix: classpath:/templates/
        suffix: .html

    web:
        resources:
            static-locations: classpath:/static/

    datasource:
        url: jdbc:mariadb://localhost:3307/shoppingdb
        username: root
        password: root
        driver-class-name: org.mariadb.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MariaDBDialect
                '[format_sql]': true